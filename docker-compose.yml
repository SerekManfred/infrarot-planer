# Infrarot-Planer – alle Container, Volumes und Netzwerke tragen das Präfix „infrarot“.
# Ports nur an 127.0.0.1. Öffentlich erreichbar ist die App über den bestehenden Caddy-Container, der dafür
# nur am Netzwerk infrarot-proxy hängt (nicht an infrarot-netz mit der Datenbank) – siehe docs/BETRIEB.md.
name: infrarot

services:
  infrarot-db:
    image: postgres:16.8-alpine
    container_name: infrarot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - infrarot-db-daten:/var/lib/postgresql/data
    networks: [infrarot-netz]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  infrarot-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: laufzeit
    image: infrarot-backend
    container_name: infrarot-backend
    restart: unless-stopped
    environment:
      INFRAROT_DATENBANK_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@infrarot-db:5432/${POSTGRES_DB}
      INFRAROT_JWT_GEHEIMNIS: ${INFRAROT_JWT_GEHEIMNIS}
      INFRAROT_COOKIE_SECURE: ${INFRAROT_COOKIE_SECURE:-true}
      INFRAROT_SITZUNG_STUNDEN: ${INFRAROT_SITZUNG_STUNDEN:-12}
    volumes:
      - infrarot-uploads:/app/uploads
    depends_on:
      infrarot-db:
        condition: service_healthy
    networks: [infrarot-netz, infrarot-proxy]
    ports:
      - "127.0.0.1:${INFRAROT_BACKEND_PORT:-8091}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/gesundheit')"]
      interval: 30s
      timeout: 5s
      retries: 3

  infrarot-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: infrarot-frontend
    container_name: infrarot-frontend
    restart: unless-stopped
    depends_on: [infrarot-backend]
    networks: [infrarot-netz, infrarot-proxy]
    ports:
      - "127.0.0.1:${INFRAROT_FRONTEND_PORT:-8090}:80"

volumes:
  infrarot-db-daten:
    name: infrarot-db-daten
  infrarot-uploads:
    name: infrarot-uploads

networks:
  infrarot-netz:
    name: infrarot-netz
  # Von außen angelegt (docker network create infrarot-proxy), damit „docker compose down“ es nicht entfernt,
  # solange Caddy daran hängt
  infrarot-proxy:
    name: infrarot-proxy
    external: true
